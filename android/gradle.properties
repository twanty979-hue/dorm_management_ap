android.useAndroidX=true
# APK ZIP headers use the Gregorian calendar. Without an explicit locale, the
# Thai Buddhist calendar supplies year 2569, outside ZIP's supported range.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
